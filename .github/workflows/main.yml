
name: Build StoreTrack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract StoreTrack v0.6.5 source
        run: unzip -o StoreTrack-Android-Source-v0.6.5-Reminder-Diagnostic.zip -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build StoreTrack APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreTrack-debug-apk-v0.6.5
          path: app/build/outputs/apk/debug/app-debug.apk
